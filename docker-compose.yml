version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blood-donation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_donation_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    container_name: blood-donation-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blood_donation_db?schema=public
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: 'no'

  api:
    build:
      context: .
      target: production
    container_name: blood-donation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blood_donation_db?schema=public
      JWT_SECRET: change-this-super-secret-access-token-key
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: change-this-super-secret-refresh-token-key
      REFRESH_EXPIRES_IN: 7d
      FCM_SERVER_KEY: ''
      DEFAULT_RADIUS: 50
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 20
    ports:
      - '3000:3000'

volumes:
  postgres_data:
